<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#884466" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="boxGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff758c"/>
      <stop offset="100%" stop-color="#ff7eb3"/>
    </linearGradient>
    <linearGradient id="lidGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffa0b5"/>
      <stop offset="100%" stop-color="#ff8da7"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8edea"/>
      <stop offset="100%" stop-color="#fed6e3"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow2)">
    <!-- Box Body -->
    <rect x="25" y="52" width="70" height="52" rx="8" fill="url(#boxGrad2)"/>
    <!-- Box Vertical Ribbon -->
    <rect x="53" y="52" width="14" height="52" fill="#ffffff" opacity="0.85"/>
    <!-- Lid -->
    <rect x="20" y="40" width="80" height="18" rx="5" fill="url(#lidGrad2)"/>
    <!-- Lid Ribbon -->
    <rect x="53" y="40" width="14" height="18" fill="#ffffff" opacity="0.85"/>
    <!-- Bow Loops -->
    <path d="M46 38 C32 20, 52 14, 57 36 Z" fill="#ffffff"/>
    <path d="M74 38 C88 20, 68 14, 63 36 Z" fill="#ffffff"/>
    <!-- Bow Knot -->
    <circle cx="60" cy="38" r="7" fill="#ffe3ec"/>
    <!-- Mystery Question Mark Badge -->
    <circle cx="60" cy="78" r="16" fill="#ffffff" opacity="0.95"/>
    <text x="60" y="85" font-family="'Comic Sans MS', 'Fredoka One', 'Canva Sans', sans-serif" font-size="20" font-weight="bold" fill="#ff4d79" text-anchor="middle">✨</text>
    <!-- Sparkles -->
    <path d="M20 30 Q24 30 24 26 Q24 30 28 30 Q24 30 24 34 Q24 30 20 30 Z" fill="#ffe359"/>
    <path d="M94 25 Q97 25 97 22 Q97 25 100 25 Q97 25 97 28 Q97 25 94 25 Z" fill="#ffe359"/>
  </g>
</svg>
